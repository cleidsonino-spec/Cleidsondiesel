name: Cummins OBD catalog audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * 1"

permissions:
  contents: read

concurrency:
  group: cummins-obd-catalog-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Read-only catalog audit through Supabase REST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit Cummins catalog through HTTPS API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: node tools/obd-audit/audit.mjs
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cummins-obd-audit
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 30
