name: Build Cleidson Diesel official Android release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret for ${name}. See docs/ANDROID-RELEASE.md."
              exit 1
            fi
          done

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Prepare app icon from the official logo stored in the Lovable project
        run: |
          mkdir -p assets
          curl --fail --location --silent --show-error \
            "https://cleidsondiesel.lovable.app/__l5e/assets-v1/41c2a444-72e8-4aa8-9743-53a5e065f6dc/logo-cleidson-diesel.png" \
            --output assets/logo-cleidson-diesel.png
          test -s assets/logo-cleidson-diesel.png
          identify assets/logo-cleidson-diesel.png
          convert assets/logo-cleidson-diesel.png -resize 1024x1024 -gravity center -background none -extent 1024x1024 assets/icon-only.png
          cp assets/icon-only.png assets/splash.png

      - name: Install Capacitor and asset generator
        run: |
          mkdir -p /tmp/capacitor-tools
          cd /tmp/capacitor-tools
          npm init -y
          npm install --no-audit --no-fund typescript @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets
          ln -s /tmp/capacitor-tools/node_modules "$GITHUB_WORKSPACE/node_modules"

      - name: Add Android project
        run: npx cap add android

      - name: Generate Android app icons
        run: npx capacitor-assets generate --android

      - name: Sync Android project
        run: npx cap sync android

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cleidson-release.jks"
          test -s "$RUNNER_TEMP/cleidson-release.jks"
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/cleidson-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK and Play Store bundle
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease

      - name: Upload signed release files
        uses: actions/upload-artifact@v4
        with:
          name: cleidson-diesel-official-android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
