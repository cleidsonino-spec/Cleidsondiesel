name: Build Cleidson Diesel official Android release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret for ${name}. See docs/ANDROID-RELEASE.md."
              exit 1
            fi
          done

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Prepare app icon from the approved Cleidson Diesel logo
        run: |
          mkdir -p assets
          curl --fail --location --silent --show-error \
            "https://cleidsondiesel.lovable.app/__l5e/assets-v1/41c2a444-72e8-4aa8-9743-53a5e065f6dc/logo-cleidson-diesel.png" \
            --output assets/logo-cleidson-diesel.png
          test -s assets/logo-cleidson-diesel.png
          identify assets/logo-cleidson-diesel.png
          convert assets/logo-cleidson-diesel.png -resize 1024x1024 -gravity center -background none -extent 1024x1024 assets/icon-only.png
          convert assets/logo-cleidson-diesel.png -resize 680x680 -gravity center -background none -extent 1024x1024 assets/icon-foreground.png
          convert -size 1024x1024 xc:'#FFFFFF' assets/icon-background.png
          cp assets/icon-only.png assets/splash.png
          identify assets/icon-only.png assets/icon-foreground.png assets/icon-background.png

      - name: Install Capacitor and asset generator
        run: |
          mkdir -p /tmp/capacitor-tools
          cd /tmp/capacitor-tools
          npm init -y
          npm install --no-audit --no-fund typescript @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets @capacitor/push-notifications@7 @capacitor/app@7 @capacitor/browser@7 @capacitor/preferences@7.0.3
          ln -s /tmp/capacitor-tools/node_modules "$GITHUB_WORKSPACE/node_modules"

      - name: Add Android project
        run: npx cap add android

      - name: Configure verified Android App Link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          marker = "        </activity>"
          intent_filter = """            <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="cleidsondiesel.lovable.app" android:pathPrefix="/auth" />
                      </intent-filter>
          """
          if 'android:host="cleidsondiesel.lovable.app"' not in content:
              if marker not in content:
                  raise SystemExit("Could not find MainActivity closing tag in AndroidManifest.xml")
              content = content.replace(marker, intent_filter + marker, 1)
              manifest.write_text(content)
          PY

      - name: Generate Android app icons
        run: npx capacitor-assets generate --android

      - name: Configure Firebase for Android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Missing GitHub Actions secret GOOGLE_SERVICES_JSON. Add the complete google-services.json content in repository Actions secrets."
            exit 1
          fi
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          node -e "const f=require('./android/app/google-services.json'); if (!f.client?.some(c => c.client_info?.android_client_info?.package_name === 'br.com.cleidsondiesel.painel')) process.exit(1)"

      - name: Sync Android project
        run: npx cap sync android

      - name: Add FCM notification status icons
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_quote_approved.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M9,16.17 4.83,12 3.41,13.41 9,19 21,7 19.59,5.59z" />
          </vector>
          XML
          cat > android/app/src/main/res/drawable/ic_stat_quote_rejected.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M19,6.41 17.59,5 12,10.59 6.41,5 5,6.41 10.59,12 5,17.59 6.41,19 12,13.41 17.59,19 19,17.59 13.41,12z" />
          </vector>
          XML
          test -s android/app/src/main/res/drawable/ic_stat_quote_approved.xml
          test -s android/app/src/main/res/drawable/ic_stat_quote_rejected.xml

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cleidson-release.jks"
          test -s "$RUNNER_TEMP/cleidson-release.jks"
          APP_LINK_SHA256="$(keytool -list -v -keystore "$RUNNER_TEMP/cleidson-release.jks" -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" | awk -F': ' '/SHA256:/{print $2; exit}')"
          if [ -z "$APP_LINK_SHA256" ]; then
            echo "::error::Could not read the release certificate SHA-256 fingerprint."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/app-links"
          printf '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"br.com.cleidsondiesel.painel","sha256_cert_fingerprints":["%s"]}}]\n' "$APP_LINK_SHA256" > "$RUNNER_TEMP/app-links/assetlinks.json"
          echo "Android App Links SHA-256: $APP_LINK_SHA256"
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/cleidson-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK and Play Store bundle
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease

      - name: Upload signed release files
        uses: actions/upload-artifact@v4
        with:
          name: cleidson-diesel-official-android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            ${{ runner.temp }}/app-links/assetlinks.json
          if-no-files-found: error
          retention-days: 30
