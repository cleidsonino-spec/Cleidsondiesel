name: Deploy Cleidson Diesel push functions

on:
  workflow_dispatch:
  push:
    branches:
      - feature/painel-funcionarios
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-supabase-push-functions.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy Supabase Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::Configure SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_ID in GitHub Actions secrets."
            exit 1
          fi
          npx --yes supabase@latest functions deploy register-device --project-ref "$SUPABASE_PROJECT_ID"
          npx --yes supabase@latest functions deploy unregister-device --project-ref "$SUPABASE_PROJECT_ID"
          npx --yes supabase@latest functions deploy notify-admin --project-ref "$SUPABASE_PROJECT_ID"
          npx --yes supabase@latest functions deploy staff-invitations --project-ref "$SUPABASE_PROJECT_ID"
