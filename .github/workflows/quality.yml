name: Quality checks

on:
  push:
    branches:
      - main
      - security/session-isolation-logout
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun run test
      - name: Lint auth and session files
        run: >-
          bunx eslint
          src/lib/auth-session.ts
          src/lib/auth-session.test.ts
          src/lib/auth-routing.ts
          src/lib/auth-routing.test.ts
          src/integrations/supabase/authStorage.ts
          src/integrations/supabase/authStorage.test.ts
          src/routes/auth.tsx
          src/routes/__root.tsx
          src/routes/_authenticated/equipe.tsx
          src/routes/_authenticated/painel.tsx
          --rule 'prettier/prettier: off'
          --rule '@typescript-eslint/no-explicit-any: off'
