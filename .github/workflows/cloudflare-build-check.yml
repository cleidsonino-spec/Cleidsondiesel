name: Cloudflare build check

on:
  push:
    branches:
      - feat/cloudflare-neon-runtime
  pull_request:
    branches:
      - feat/independent-platform-foundation

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Run automated tests
        run: bun run test
      - name: Build application
        run: bun run build
      - name: Verify Neon database connection
        run: bun run db:check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Validate Worker bundle without deploying
        run: bunx wrangler deploy --dry-run
