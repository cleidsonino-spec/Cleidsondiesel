name: Cloudflare build check

on:
  push:
    branches:
      - feat/cloudflare-neon-runtime
  pull_request:
    branches:
      - feat/independent-platform-foundation

jobs:
  sync-lockfile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/cloudflare-neon-runtime'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feat/cloudflare-neon-runtime
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Refresh Bun lockfile
        run: bun install --ignore-scripts
      - name: Commit lockfile if changed
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore: sync Bun lockfile"
            git push origin HEAD:feat/cloudflare-neon-runtime
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Run automated tests
        run: bun run test
      - name: Build application
        run: bun run build
      - name: Verify Neon database connection
        run: bun run db:check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Validate Worker bundle without deploying
        run: bunx wrangler deploy --dry-run
