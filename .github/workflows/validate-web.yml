name: Validate Cleidson Diesel web app

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/painel-funcionarios]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
