name: Validate Cleidson Diesel web app

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/painel-funcionarios]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
