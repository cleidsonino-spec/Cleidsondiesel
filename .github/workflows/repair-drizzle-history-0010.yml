name: Repair Drizzle migration history 0010

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type MARK-0010-APPLIED to record history only"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cleidson-diesel-drizzle-history-repair
  cancel-in-progress: false

jobs:
  mark-history-only:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'MARK-0010-APPLIED' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Verify and record migration history only
        env:
          CLEIDSON_DIESEL_DATABASE_URL: ${{ secrets.CLEIDSON_DIESEL_DATABASE_URL }}
        run: node scripts/repair-drizzle-history-0010.mjs
