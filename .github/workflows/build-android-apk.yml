name: Build Cleidson Diesel APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-apk
  pull_request:
    branches:
      - main
    paths:
      - "capacitor.config.ts"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Prepare app icon from the website favicon
        run: |
          mkdir -p assets
          convert public/favicon.png -resize 1024x1024 -gravity center -background none -extent 1024x1024 assets/icon-only.png
          cp assets/icon-only.png assets/splash.png

      - name: Install Capacitor and asset generator
        run: |
          mkdir -p /tmp/capacitor-tools
          cd /tmp/capacitor-tools
          npm init -y
          npm install --no-audit --no-fund typescript @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets @capacitor/push-notifications@7
          ln -s /tmp/capacitor-tools/node_modules "$GITHUB_WORKSPACE/node_modules"

      - name: Add Android project
        run: npx cap add android

      - name: Generate Android app icons
        run: npx capacitor-assets generate --android

      - name: Configure Firebase for Android (optional until secret is added)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            mkdir -p android/app
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            node -e "const f=require('./android/app/google-services.json'); if (!f.client?.some(c => c.client_info?.android_client_info?.package_name === 'br.com.cleidsondiesel.painel')) process.exit(1)"
          else
            echo "::warning::GOOGLE_SERVICES_JSON não configurado; o APK será compilado sem registro FCM."
          fi

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cleidson-diesel-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
