name: Build Cleidson Diesel APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-apk
  pull_request:
    branches:
      - main
    paths:
      - "capacitor.config.ts"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Prepare app icon from the official logo stored in the Lovable project
        run: |
          mkdir -p assets
          curl --fail --location --silent --show-error \
            "https://cleidsondiesel.lovable.app/__l5e/assets-v1/41c2a444-72e8-4aa8-9743-53a5e065f6dc/logo-cleidson-diesel.png" \
            --output assets/logo-cleidson-diesel.png
          test -s assets/logo-cleidson-diesel.png
          identify assets/logo-cleidson-diesel.png
          convert assets/logo-cleidson-diesel.png -resize 1024x1024 -gravity center -background none -extent 1024x1024 assets/icon-only.png
          convert assets/logo-cleidson-diesel.png -resize 680x680 -gravity center -background none -extent 1024x1024 assets/icon-foreground.png
          convert -size 1024x1024 xc:'#FFFFFF' assets/icon-background.png
          cp assets/icon-only.png assets/splash.png
          identify assets/icon-only.png assets/icon-foreground.png assets/icon-background.png

      - name: Install Capacitor and asset generator
        run: |
          mkdir -p /tmp/capacitor-tools
          cd /tmp/capacitor-tools
          npm init -y
          npm install --no-audit --no-fund typescript @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/app@7 @capacitor/assets
          ln -s /tmp/capacitor-tools/node_modules "$GITHUB_WORKSPACE/node_modules"

      - name: Add Android project
        run: npx cap add android

      - name: Configure Android OAuth deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          if 'android:scheme="cleidsondiesel"' not in source:
              activity = re.search(r'(<activity\b[^>]*android:name="[^"]*MainActivity"[^>]*>)', source)
              if not activity:
                  raise SystemExit("Could not find MainActivity in AndroidManifest.xml")
              intent_filter = """
            <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="cleidsondiesel" android:host="auth" />
              </intent-filter>"""
              source = source[:activity.end()] + intent_filter + source[activity.end():]
              manifest.write_text(source)
          print("Registered cleidsondiesel://auth deep link")
          PY

      - name: Generate Android app icons
        run: npx capacitor-assets generate --android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cleidson-diesel-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
