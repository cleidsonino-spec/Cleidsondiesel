name: Build Cleidson Diesel APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-apk
  pull_request:
    branches:
      - main
    paths:
      - "capacitor.config.ts"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Prepare app icon from the approved Cleidson Diesel logo
        run: |
          mkdir -p assets
          curl --fail --location --silent --show-error \
            "https://cleidsondiesel.lovable.app/__l5e/assets-v1/41c2a444-72e8-4aa8-9743-53a5e065f6dc/logo-cleidson-diesel.png" \
            --output assets/logo-cleidson-diesel.png
          test -s assets/logo-cleidson-diesel.png
          identify assets/logo-cleidson-diesel.png
          convert assets/logo-cleidson-diesel.png -resize 1024x1024 -gravity center -background none -extent 1024x1024 assets/icon-only.png
          convert assets/logo-cleidson-diesel.png -resize 680x680 -gravity center -background none -extent 1024x1024 assets/icon-foreground.png
          convert -size 1024x1024 xc:'#FFFFFF' assets/icon-background.png
          cp assets/icon-only.png assets/splash.png
          identify assets/icon-only.png assets/icon-foreground.png assets/icon-background.png

      - name: Install Capacitor and asset generator
        run: |
          mkdir -p /tmp/capacitor-tools
          cd /tmp/capacitor-tools
          npm init -y
          npm install --no-audit --no-fund typescript @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets @capacitor/app@7 @capacitor/browser@7 @capacitor/preferences@7 @capacitor/push-notifications@7
          ln -s /tmp/capacitor-tools/node_modules "$GITHUB_WORKSPACE/node_modules"

      - name: Add Android project
        run: npx cap add android

      - name: Configure verified HTTPS OAuth callback for Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(manifest)
          root = tree.getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")

          target = None
          for activity in root.findall(".//activity"):
              for intent in activity.findall("intent-filter"):
                  actions = {node.get(android + "name") for node in intent.findall("action")}
                  categories = {node.get(android + "name") for node in intent.findall("category")}
                  if "android.intent.action.MAIN" in actions and "android.intent.category.LAUNCHER" in categories:
                      target = activity
                      break
              if target is not None:
                  break

          if target is None:
              raise SystemExit("Atividade MAIN/LAUNCHER não encontrada no manifesto Android")

          for intent in list(target.findall("intent-filter")):
              data = intent.find("data")
              if data is not None and data.get(android + "host") == "cleidsondiesel.lovable.app":
                  target.remove(intent)

          callback = ET.SubElement(target, "intent-filter", {android + "autoVerify": "true"})
          ET.SubElement(callback, "action", {android + "name": "android.intent.action.VIEW"})
          ET.SubElement(callback, "category", {android + "name": "android.intent.category.DEFAULT"})
          ET.SubElement(callback, "category", {android + "name": "android.intent.category.BROWSABLE"})
          ET.SubElement(callback, "data", {
              android + "scheme": "https",
              android + "host": "cleidsondiesel.lovable.app",
              android + "pathPrefix": "/auth"
          })

          legacy = ET.SubElement(target, "intent-filter")
          ET.SubElement(legacy, "action", {android + "name": "android.intent.action.VIEW"})
          ET.SubElement(legacy, "category", {android + "name": "android.intent.category.DEFAULT"})
          ET.SubElement(legacy, "category", {android + "name": "android.intent.category.BROWSABLE"})
          ET.SubElement(legacy, "data", {
              android + "scheme": "br.com.cleidsondiesel.painel",
              android + "host": "auth",
              android + "path": "/callback"
          })

          manifest.write_bytes(ET.tostring(root, encoding="utf-8", xml_declaration=True))
          print("App Links HTTPS /auth e esquema legado /auth/callback aplicados")
          PY


      - name: Generate Android app icons
        run: npx capacitor-assets generate --android

      - name: Configure Firebase for Android (optional until secret is added)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            mkdir -p android/app
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            node -e "const f=require('./android/app/google-services.json'); if (!f.client?.some(c => c.client_info?.android_client_info?.package_name === 'br.com.cleidsondiesel.painel')) process.exit(1)"
          else
            echo "::warning::GOOGLE_SERVICES_JSON não configurado; o APK será compilado sem registro FCM."
          fi

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Sign APK with the stable Android key when configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::warning::Chave Android permanente não configurada; mantendo APK de depuração, não válido para App Links verificados."
            exit 0
          fi

          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/cleidson-diesel-release.jks"
          ALIGNED_APK="$RUNNER_TEMP/app-aligned.apk"
          SIGNED_APK="$RUNNER_TEMP/app-signed.apk"
          trap 'rm -f "$KEYSTORE_PATH" "$ALIGNED_APK" "$SIGNED_APK"' EXIT

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -f -v 4 android/app/build/outputs/apk/debug/app-debug.apk "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED_APK"
          mv "$SIGNED_APK" android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cleidson-diesel-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
